<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Watch real DigitalOcean recordings of zfsify converting Ubuntu and attached data volumes to ZFS.">
  <title>zfsify recordings</title>
  <link rel="stylesheet" href="assets/asciinema-player/asciinema-player.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e6edf3; background: #0d1117; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1180px; padding: 32px 24px 48px; margin: auto; }
    a { color: #79c0ff; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { color: #b6dcff; }
    a:focus-visible { outline: 2px solid #79c0ff; outline-offset: 5px; }
    .brand { font: 700 20px ui-monospace, monospace; text-decoration: none; }
    h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.2; margin: 0 0 12px; letter-spacing: -.025em; }
    p { line-height: 1.6; }
    .muted { color: #9da7b3; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 16px; }
    nav a { padding: 10px 15px; border: 1px solid #30363d; border-radius: 7px; text-decoration: none; color: #c9d1d9; }
    nav a[aria-current] { color: #e6edf3; border-color: #58a6ff; background: #15263c; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 0; }
    .toolbar nav { margin: 0; }
    .toolbar nav a { font-size: 14px; padding: 7px 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; }
    #player { overflow: hidden; background: #0d1117; }
    footer { margin-top: 32px; border-top: 1px solid #21262d; padding-top: 18px; font-size: 13px; }
    #error { color: #ffa198; }
    @media (max-width: 600px) { main { padding: 22px 12px 32px; } nav a { padding: 8px 10px; } }
  </style>
</head>
<body>
<main>
  <a class="brand" href="../">⚡ zfsify</a>
  <h1 id="title">Watch a conversion</h1>
  <nav aria-label="Choose a demonstration">
    <a href="?demo=root" data-demo="root">Ubuntu root drive</a>
    <a href="?demo=volume" data-demo="volume">Attached volume</a>
    <a href="?demo=rclone" data-demo="rclone">Over 50% used · rclone</a>
  </nav>
  <div class="toolbar">
    <div class="links">
      <a id="download" href="assets/recordings/happy-path.cast" download>Download .cast</a>
    </div>
  </div>
  <div id="player" aria-label="Terminal recording player"></div>
  <p id="error" role="alert" hidden>The player could not load. You can still download the recording above.</p>
  <noscript><p>JavaScript is needed for replay. Download a recording to view it with asciinema:</p>
    <p><a href="assets/recordings/happy-path.cast" download>Root drive</a> ·
       <a href="assets/recordings/volume.cast" download>Attached volume</a> ·
       <a href="assets/recordings/rclone-root.cast" download>rclone backup</a></p>
  </noscript>
</main>
<script src="assets/asciinema-player/asciinema-player.min.js"></script>
<script>
  (() => {
    const demos = new Map([
      ['root', {title: 'Ubuntu root drive → ZFS', file: 'happy-path'}],
      ['volume', {title: 'Attached ext4 volume → ZFS', file: 'volume'}],
      ['rclone', {title: 'Back up, convert, restore', file: 'rclone-root'}]
    ]);
    const query = new URLSearchParams(location.search);
    const key = demos.has(query.get('demo')) ? query.get('demo') : 'root';
    const demo = demos.get(key);
    const cast = 'assets/recordings/' + demo.file + '.cast';
    document.title = demo.title + ' · zfsify';
    document.getElementById('title').textContent = demo.title;
    document.getElementById('download').href = cast;
    for (const link of document.querySelectorAll('[data-demo]')) {
      link.href = '?demo=' + link.dataset.demo;
      if (link.dataset.demo === key) link.setAttribute('aria-current', 'page');
    }
    try {
      AsciinemaPlayer.create(cast, document.getElementById('player'), {
        theme: 'asciinema', fit: 'width', controls: true,
        preload: true, autoplay: false, poster: 'npt:0.1'
      });
    } catch (error) {
      document.getElementById('error').hidden = false;
      console.error('Could not initialize recording player', error);
    }
  })();
</script>
</body>
</html>
